[project]
name = "signalpost-ai"
version = "0.1.0"
description = "Evidence-first company intelligence for Norwegian businesses."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "sqlalchemy>=2.0",
  "redis>=5.0",
  "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
